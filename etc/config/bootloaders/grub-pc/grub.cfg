if loadfont /boot/grub/font.pf2 ; then
 set gfxmode=auto
 insmod efi_gop
 insmod efi_uga
 insmod gfxterm
 terminal_output gfxterm
fi

# MaxregnerOS Revolutionary UI Colors
set menu_color_normal=cyan/black
set menu_color_highlight=black/cyan
set color_normal=cyan/black

set timeout=10
menuentry "🚀 Install MaxregnerOS 1.0 - Revolutionary UI" {
 set gfxpayload=keep
 linux	KERNEL_LIVE APPEND_LIVE quiet splash ---
 initrd INITRD_LIVE
}
menuentry "🛡️ Install MaxregnerOS 1.0 (Safe Graphics)" {
 set gfxpayload=keep
 linux	KERNEL_LIVE APPEND_LIVE nomodeset quiet splash ---
 initrd INITRD_LIVE
}
menuentry "⚡ Install MaxregnerOS 1.0 (Performance Mode - Nouveau disabled)" {
 set gfxpayload=keep
 linux	KERNEL_LIVE APPEND_LIVE modprobe.blacklist=nouveau quiet splash ---
 initrd INITRD_LIVE
}
menuentry "🔧 Install MaxregnerOS 1.0 (Debug Mode)" {
 set gfxpayload=keep
 linux	KERNEL_LIVE APPEND_LIVE systemd.log_level=debug ---
 initrd INITRD_LIVE
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry '💾 Boot from next volume' {
 exit
}
menuentry '⚙️ UEFI Firmware Settings' {
 fwsetup
}
fi
